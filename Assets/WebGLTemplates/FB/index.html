    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="TemplateData/UWTAspectScale.js"></script>
    <script src="%UNITY_WEBGL_LOADER_URL%"></script>
    <script>
      var unityInstance = UnityLoader.instantiate(
        "unityContainer",
        "%UNITY_WEBGL_BUILD_URL%",
        { onProgress: UnityProgress }
      );
      unityInstance.Module.onRuntimeInitialized = function () {
        var scaler = UWTAspectScaleCreate(1000, 660, 1.51515, "unityContainer");
        UWTAspectScaleShow(scaler);
      };
    </script>
    <link rel="stylesheet" href="https://use.typekit.net/vis0yeq.css" />
  </head>

  <body>
    <div id="BrainPOPsnapArea">

        style="width: 100%; height: 100%; background-color: #000"
      >
        <div id="unityContainer" style="width: 100%; height: 100%"></div>

  <!-- Google tag (gtag.js) -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-70RRTWTVBE"
  ></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());

    // The Vault player passes the site that sent the player here (PBS Wisconsin Education's "Play the game") as
    // ?vault_src=; inside the player the game's own referrer is the Vault page, so report the passed source instead.
    var vaultSrc = null;
    try {
      vaultSrc = new URL(location.href).searchParams.get("vault_src") || new URL(location.href).searchParams.get("vault_referrer");
      if (vaultSrc && !/^https:\/\/[a-z0-9.-]+\//i.test(vaultSrc)) vaultSrc = null;
    } catch (e) {}

    gtag("config", "G-70RRTWTVBE", {
      cookie_flags: "max-age=7200;secure;samesite=none",
      ...(vaultSrc ? { page_referrer: vaultSrc } : {}),
    });
  </script>
